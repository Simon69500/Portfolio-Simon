<!DOCTYPE html>
<html lang="fr">
  
  <head>
    <!-- meta charset en première position : requis par la spec HTML5 pour que -->
    <!-- le navigateur connaisse l'encodage avant de parser le reste du head -->
    <meta charset="utf-8" />

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-5FTWQPZQ');</script>
    <!-- End Google Tag Manager -->

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Couleur de la barre d'adresse mobile, adaptée au thème clair/sombre du site -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <title>Simon Badin | Développeur Web & Mobile Fullstack</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="canonical" href="https://simon69500.github.io/Portfolio-Simon/" />
    <meta name="author" content="Simon Badin" />
    <meta name="description" content="Portfolio de Simon Badin, développeur Web & Mobile Fullstack : découvrez ses projets, compétences techniques et réalisations professionnelles." />

    <!-- Open Graph pour LinkedIn, WhatsApp, Messenger -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Simon Badin | Développeur Web & Mobile Fullstack" />
    <meta property="og:description" content="Portfolio de Simon Badin : projets, compétences et réalisations en développement Web & Mobile Fullstack." />
    <meta property="og:url" content="https://simon69500.github.io/Portfolio-Simon/" />
    <meta property="og:image" content="https://simon69500.github.io/Portfolio-Simon/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card : LinkedIn/WhatsApp lisent les balises Open Graph ci-dessus, -->
    <!-- mais X/Twitter attend ses propres balises pour garantir un aperçu correct -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Simon Badin | Développeur Web & Mobile Fullstack" />
    <meta name="twitter:description" content="Portfolio de Simon Badin : projets, compétences et réalisations en développement Web & Mobile Fullstack." />
    <meta name="twitter:image" content="https://simon69500.github.io/Portfolio-Simon/preview.png" />

  </head>
